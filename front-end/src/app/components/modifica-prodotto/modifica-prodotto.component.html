<div class="page-container">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">

        <div class="card modern-card animate__animated animate__fadeIn">

          <div class="card-header-custom text-center">
            <h3>
              <i class="fa-solid fa-pencil me-2"></i>Modifica Prodotto
            </h3>
          </div>

          <div class="card-body">

            @if (isError) {
              <div class="alert alert-danger d-flex align-items-center" role="alert">
                <i class="fa-solid fa-circle-exclamation me-2"></i>
                <div>{{ message }}</div>
              </div>
            }

            <form (ngSubmit)="onSubmit()" #editForm="ngForm">

              <div class="mb-4">
                <label class="form-label text-muted">
                  <i class="fa-solid fa-barcode input-icon me-2"></i>Codice Prodotto
                </label>
                <input type="text" class="form-control bg-light"
                  [value]="codiceProdotto" readonly disabled>
                </div>

                <div class="mb-4">
                  <label for="nome" class="form-label">
                    <i class="fa-solid fa-tag input-icon me-2"></i>Nome Prodotto
                  </label>
                  <input type="text" class="form-control" id="nome" name="nome"
                    [(ngModel)]="formModel.nome" required>
                  </div>

                  <div class="mb-4">
                    <label for="descrizione" class="form-label">
                      <i class="fa-solid fa-align-left input-icon me-2"></i>Descrizione
                    </label>
                    <textarea class="form-control" id="descrizione" name="descrizione" rows="3"
                    [(ngModel)]="formModel.descrizione"></textarea>
                  </div>

                  <div class="row">
                    <div class="col-md-6 mb-4">
                      <label for="prezzo" class="form-label">
                        <i class="fa-solid fa-euro-sign input-icon me-2"></i>Prezzo
                      </label>
                      <input type="number" step="0.01" class="form-control" id="prezzo" name="prezzo"
                        [(ngModel)]="formModel.prezzo" required min="0">
                      </div>

                      <div class="col-md-6 mb-4">
                        <label for="quantita" class="form-label">
                          <i class="fa-solid fa-layer-group input-icon me-2"></i>Quantità
                        </label>
                        <input type="number" class="form-control" id="quantita" name="quantita"
                          [(ngModel)]="formModel.quantita" required min="0">
                        </div>
                      </div>

                      <hr class="my-4 text-muted">

                      <div class="d-flex justify-content-between">
                        <button type="button" class="btn btn-outline-secondary btn-custom" (click)="annulla()">
                          <i class="fa-solid fa-arrow-left me-2"></i>Indietro
                        </button>

                        <button type="submit" class="btn btn-brown btn-custom"
                          [disabled]="!editForm.form.valid || isLoading">
                          @if (isLoading) {
                            <span>
                              <i class="fa-solid fa-spinner fa-spin me-2"></i>Aggiornamento...
                            </span>
                          }
                          @if (!isLoading) {
                            <span>
                              <i class="fa-solid fa-floppy-disk me-2"></i>Salva Modifiche
                            </span>
                          }
                        </button>
                      </div>

                    </form>
                  </div>
                </div>

              </div>
            </div>
          </div>
        </div>
