name: Security & Build Check

# Avvia il controllo ogni volta che viene aperta una Pull Request verso il branch main
on:
  pull_request:
    branches: [ "main" ]
  # Ti permette anche di avviarlo manualmente dalla tab "Actions" di GitHub
  workflow_dispatch: 

jobs:
  security-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica il codice dal repository
        uses: actions/checkout@v4

      # --- CONTROLLO back-end (Spring Boot) ---
      - name: Configura Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build Spring Boot & OWASP Dependency Check
        # Ci spostiamo nella cartella back-end ed eseguiamo la build Maven con il controllo OWASP
        working-directory: ./back-end
        run: .\mvnw clean verify -DskipTests=true

      # --- CONTROLLO front-end (Angular) ---
      - name: Configura Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24' # Modificala se usi una versione di Node diversa per Angular

      - name: Installa dipendenze Angular
        working-directory: ./front-end
        run: npm ci

      - name: Audit di Sicurezza NPM (Angular)
        working-directory: ./front-end
        # Blocca la pipeline solo se ci sono vulnerabilità high o critical nel front-end
        run: npm audit --audit-level=high