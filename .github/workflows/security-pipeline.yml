name: Security & Build Check

on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  pull-requests: write

  workflow_dispatch: 

jobs:
  security-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica il codice dal repository
        uses: actions/checkout@v4

      - name: Configura Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build Spring Boot & OWASP Dependency Check

        working-directory: ./back-end
        run: ./mvnw clean verify -DskipTests=true

      - name: Configura Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Installa dipendenze Angular
        working-directory: ./front-end
        run: npm ci

      - name: Audit di Sicurezza NPM (Angular)
        working-directory: ./front-end
        run: npm audit --audit-level=high